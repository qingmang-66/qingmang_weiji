name: flutter_local_notifications_windows
description: Stub implementation of flutter_local_notifications_windows that avoids FFI AOT crashes
version: 3.0.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications_platform_interface: ^11.0.0
  meta: ^1.11.0
  timezone: ^0.11.0
  xml: ^6.5.0

flutter:
  plugin:
    implements: flutter_local_notifications
    platforms:
      windows:
        dartPluginClass: FlutterLocalNotificationsWindows
