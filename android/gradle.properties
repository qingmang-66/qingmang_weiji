#sun.stdout/stderr.encoding：Gradle 守护进程用 GBK 输出时，本脚本（已 chcp 65001）
#看到的是一堆乱码 —— 构建脚本里的中文报错、以及路径里的中文用户名都会变成问号，
#导致真正该看的提示读不出来。强制守护进程按 UTF-8 输出，与控制台一致。
# 堆从 8G 降到 4G：单模块 Flutter 工程 R8/Kotlin 编译用不到 8G，
# 过大的堆反而拉长守护进程启动与 GC；并开启并行构建与构建缓存。
# （守护进程在启动时读取该属性，改完需要 android\gradlew.bat --stop 重启一次）
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableR8.fullMode=true
kotlin.incremental=true

