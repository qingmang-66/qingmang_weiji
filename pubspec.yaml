name: qingmang_weiji
description: "清茫微记 - 基于艾宾浩斯遗忘曲线的英语单词记忆软件"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # 本地数据库 (sqflite 不支持 Windows，改用 sqflite_common_ffi)
  sqflite_common_ffi: ^2.3.4
  path_provider: ^2.1.5
  path: ^1.9.1
  sqflite: ^2.4.1  # 移动端兼容保留
  
  # TTS 发音
  flutter_tts: ^4.2.2
  
  # 音频播放（在线词典音频）
  audioplayers: ^6.1.0
  
  # 网络请求（获取词典音频）
  http: ^1.3.0
  
  # 状态管理
  provider: ^6.1.2
  
  # 文件选择（导入词库）
  file_picker: ^9.2.3
  
  # 本地偏好存储
  shared_preferences: ^2.3.4

  # 本地通知（复习提醒）
  flutter_local_notifications: 21.0.0

  # 图表库
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/db/
    - assets/images/
    - assets/wordbooks/
