name: qingmang_weiji
description: "清茫微记 - 基于艾宾浩斯遗忘曲线的英语单词记忆软件"
publish_to: 'none'
version: 2.1.0+4

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # 本地数据库 (sqflite 不支持 Windows，改用 sqflite_common_ffi)
  sqflite_common_ffi: ^2.3.4
  # Web端数据库支持（基于IndexedDB + SQLite WASM）
  sqflite_common_ffi_web: ^1.0.0
  path_provider: ^2.1.5
  path: ^1.9.1
  sqflite: ^2.4.1  # 移动端兼容保留
  
  # TTS 发音
  flutter_tts: ^4.2.2
  
  # 音频播放（在线词典音频）
  audioplayers: ^6.1.0
  
  # 网络请求（获取词典音频）
  http: ^1.3.0
  
  # 状态管理
  provider: ^6.1.2
  
  # 文件选择（导入词库）
  file_picker: ^9.2.3

  # 系统分享（Android 备份/周报导出）
  share_plus: ^11.0.0
  
  # 本地偏好存储
  shared_preferences: ^2.3.4

  # 本地通知（复习提醒）
  flutter_local_notifications: 21.0.0

  # 时区（本地定时通知，flutter_local_notifications 的依赖，显式声明以便直接引用）
  timezone: ^0.11.0

  # 系统IANA时区名称（用于每日提醒调度）
  flutter_timezone: ^4.1.1

  # 图表库
  fl_chart: ^0.69.0

  # 可见性检测（用于性能优化）
  visibility_detector: ^0.4.0

  # Windows 桌面通知（替代 flutter_local_notifications_windows 的 FFI 实现，避免 AOT 崩溃）
  local_notifier: ^0.1.6

dependency_overrides:
  # 使用本地桩包替换 flutter_local_notifications_windows，移除 FFI 绑定避免 AOT 编译崩溃
  flutter_local_notifications_windows:
    path: packages/flutter_local_notifications_windows

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.15

flutter:
  uses-material-design: true
  
  assets:
    - assets/db/
    - assets/images/
    - assets/wordbooks/
    - assets/wordlists/
    - assets/shaders/

# 配置sqlite3使用系统sqlite3，避免构建时从GitHub下载DLL
hooks:
  user_defines:
    sqlite3:
      source: system
      # Windows使用winsqlite3.dll，Linux/macOS使用libsqlite3
      name_windows: winsqlite3
      name: sqlite3
